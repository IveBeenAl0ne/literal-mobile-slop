name: Build Tycoon Hub
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      sign_ios:
        description: 'Sign iOS IPA using configured certificate and profile'
        type: boolean
        default: false
      ios_export_method:
        description: 'Must match your provisioning profile'
        type: choice
        options: [debugging, release-testing, app-store-connect]
        default: debugging
permissions:
  contents: read
env:
  GODOT_VERSION: 4.5.1
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Godot
        run: |
          curl -fL --retry 3 -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d /tmp/godot
          sudo install /tmp/godot/Godot* /usr/local/bin/godot
      - name: Validate server and native gameplay
        run: |
          python -m unittest discover -s tests -v
          godot --headless --path client --editor --import --quit
          godot --headless --path client --script res://tests/test_simulation.gd
          godot --headless --path client --script res://tests/test_world.gd
      - name: Test native catalog downloads
        run: |
          mkdir -p /tmp/tycoon-test-packs
          python tools/create_test_pack.py /tmp/tycoon-test-packs
          python server/server.py --host 127.0.0.1 --port 18787 --packs /tmp/tycoon-test-packs > /tmp/tycoon-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          python tools/wait_server.py http://127.0.0.1:18787/catalog.json
          godot --headless --path client --script res://tests/test_download.gd
  android:
    needs: test
    runs-on: ubuntu-latest
    env:
      TYCOON_DEBUG_KEYSTORE: ${{ runner.temp }}/tycoon-debug.keystore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/tycoon-debug.keystore
          key: tycoonhub-debug-keystore-v1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install Godot and export templates
        run: |
          curl -fL --retry 3 -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d /tmp/godot
          sudo install /tmp/godot/Godot* /usr/local/bin/godot
          curl -fL --retry 3 -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz 'templates/android*' -d /tmp/export
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          cp /tmp/export/templates/android* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
      - name: Configure and export installable debug APK
        env:
          TYCOON_DEBUG_KEYSTORE: ${{ runner.temp }}/tycoon-debug.keystore
        run: |
          if [ ! -f "$TYCOON_DEBUG_KEYSTORE" ]; then keytool -genkeypair -keystore "$TYCOON_DEBUG_KEYSTORE" -storepass android -alias androiddebugkey -keypass android -dname "CN=Tycoon Hub Debug" -keyalg RSA -keysize 2048 -validity 10000; fi
          mkdir -p build/android
          godot --headless --path client --editor --import --quit
          godot --headless --path client --editor --script ../tools/configure_build.gd
          godot --headless --path client --export-debug Android ../build/android/TycoonHub.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TycoonHub-Android-debug
          path: build/android/TycoonHub.apk
          if-no-files-found: error
  ios:
    needs: test
    runs-on: macos-14
    env:
      IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and iOS export templates
        run: |
          curl -fL --retry 3 -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          unzip -q godot.zip -d /tmp/godot
          echo "/tmp/godot/Godot.app/Contents/MacOS" >> "$GITHUB_PATH"
          curl -fL --retry 3 -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz 'templates/ios.zip' -d /tmp/export
          mkdir -p "$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          cp /tmp/export/templates/ios.zip "$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable/"
      - name: Export Xcode project
        run: |
          mkdir -p build/ios
          Godot --headless --path client --editor --import --quit
          Godot --headless --path client --editor --script ../tools/configure_build.gd
          Godot --headless --path client --export-debug iOS ../build/ios/TycoonHub.zip
      - name: Compile unsigned iPhone app
        run: |
          xcodebuild -project build/ios/TycoonHub.xcodeproj -scheme TycoonHub -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/derived CODE_SIGNING_ALLOWED=NO build
          mkdir -p build/unsigned/Payload
          cp -R build/derived/Build/Products/Debug-iphoneos/TycoonHub.app build/unsigned/Payload/
          cd build/unsigned
          zip -qr ../TycoonHub-unsigned.ipa Payload
      - name: Optionally sign iOS IPA
        if: github.event_name == 'workflow_dispatch' && inputs.sign_ios
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          IOS_SIGNING_IDENTITY: ${{ vars.IOS_SIGNING_IDENTITY }}
          IOS_EXPORT_METHOD: ${{ inputs.ios_export_method }}
        run: python3 tools/sign_ios.py
      - uses: actions/upload-artifact@v4
        with:
          name: TycoonHub-iOS-unsigned-and-Xcode
          path: |
            build/ios/
            build/TycoonHub-unsigned.ipa
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.sign_ios
        with:
          name: TycoonHub-iOS-signed
          path: build/signed/export/*.ipa
          if-no-files-found: error
